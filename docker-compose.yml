version: "3.9"

services:
  app:
    build: .
    container_name: eventsocial-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://eventsocial:eventsocial_secret@db:5432/eventsocial
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: eventsocial-db
    environment:
      - POSTGRES_USER=eventsocial
      - POSTGRES_PASSWORD=eventsocial_secret
      - POSTGRES_DB=eventsocial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsocial"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventsocial-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
